name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.17.6 && pip install -e . --no-deps
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Verification and validation tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Command-line run (Re = 1000, 129 x 129, compared with Ghia et al.)
        env:
          MPLBACKEND: Agg
        run: python -m cavity --re 1000 --n 129
